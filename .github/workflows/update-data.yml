name: Veriyi Tazele (xlsx -> summary.json)

# data/*.xlsx değişince summary.json'u otomatik üretip commit'ler.
on:
  push:
    branches: [main, master]
    paths: ["data/*.xlsx", "scripts/build_data.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/build_data.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/summary.json data/manifest.json
          git diff --cached --quiet || git commit -m "veri: summary.json tazelendi"
          git push
